name: Faisal replay (rules on past real data)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days to replay"
        required: true
        default: "120"

permissions:
  contents: write

concurrency:
  group: faisal-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore fundamentals cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fund-replay-${{ github.run_id }}
          restore-keys: fund-
      - name: Replay
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED || 'sip' }}
        run: python -m faisal_scanner.replay ${{ github.event.inputs.days }}
      - name: Save results
        run: |
          git config user.name "faisal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/replay || true
          git diff --cached --quiet && exit 0
          git commit -q -m "replay ${{ github.event.inputs.days }} days"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
