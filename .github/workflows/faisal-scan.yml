name: Faisal scanner (hourly)

# يعمل كل ساعة من بداية البري ماركت (4:00 نيويورك) إلى نهاية الأفتر ماركت (20:00 نيويورك)
# = تقريباً 11:35 ص إلى 2:35 ص بتوقيت الرياض (ساعة أبكر/أبعد حسب التوقيت الصيفي الأمريكي).
# الماسح نفسه يتخطى أي تشغيل خارج 4:00–20:00 نيويورك.
# الجدول موقوف: faisal-pivot-live يفحص كل ~10 دقائق طول اليوم. هذا يبقى للتشغيل اليدوي (لو النتائج قديمة).
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: faisal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore fundamentals cache (float / short / splits)
        uses: actions/cache@v4
        with:
          path: .cache
          key: fund-${{ github.run_id }}
          restore-keys: fund-

      - name: Scan
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED || 'sip' }}
          ALPACA_SIP_DELAY_MIN: ${{ vars.ALPACA_SIP_DELAY_MIN || '16' }}
          ENABLE_MOMENTUM: ${{ vars.ENABLE_MOMENTUM || '1' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m faisal_scanner.main
          else
            python -m faisal_scanner.main --force
          fi

      - name: Save results to the repo
        run: |
          git config user.name "faisal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
